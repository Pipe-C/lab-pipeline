# Reemplaza estos dos valores por los que SonarQube Cloud te muestre al
# importar el repositorio (Administration -> General Settings -> ambos
# aparecen ahí, y también en la URL del proyecto: sonarcloud.io/project/
# overview?id=<PROJECT_KEY>).
sonar.projectKey=Pipe-C_lab-pipeline
sonar.organization=pipe-c

# Dónde está el código a analizar
sonar.sources=app

# Para que el job de GitHub Actions quede en rojo si el Quality Gate de
# SonarQube falla (y no solo se quede "informativo" en el dashboard).
sonar.qualitygate.wait=true
